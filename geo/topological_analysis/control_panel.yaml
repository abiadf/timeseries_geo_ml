# "Params to us ein main code, split per model/component"

general:
  X_windowing:
    window_size   : 200
    stride_frac   : 4 # how much we divide the window size (ie window_size=200, stride_frac=10 => stride=20)

  LSTM_AE:
    latent_dim         : 8
    encoder_hidden_dim : 24
    decoder_hidden_dim : 24
    patience           : 12
    epochs             : 5
    learning_rate      : 0.001
    lambda_topo        : 0.3
    lambda_forecast    : 1.0
    topo_every         : 10 # computes topology every X training steps (batches) in an epoch
    batch_size         : 128
    N_runs             : 1 # num times the model is run to get the avg performance

  z_windowing:
    z_window_frac : 0.08
    z_stride_frac : 0.08 # set equal to window frac for non-overlapping windows

  z_forecaster:
    H                 : 1 # ⚠️ forecasting horizon (in windows, not rows)
    hidden_dim        : 64
    epochs            : 50
    earlystop_patience: 10
    batch_size        : 32
    lr                : 0.001
    # dataset_list: ["nasa_moon", "china_weather", "szeged_weather", "india_ocean_waves", "longterm_weather", "panama", "wind_power", "turbine_power"]

  persistence:
    max_dim   : 2
    pixel_size: 0.2



