# "Params to us ein main code, split per model/component"

general:
  X_windowing:
    window_size   : 200
    stride_frac   : 15 # how much we divide the window size (ie window_size=200, stride_frac=10 => stride=20)

  LSTM_AE:
    latent_dim         : 8
    encoder_hidden_dim : 56
    decoder_hidden_dim : 56
    patience           : 12
    epochs             : 100
    learning_rate      : 0.001

  z_windowing:
    z_window_frac : 0.06
    z_stride_frac : 0.06

  z_forecaster:
    H                 : 1 # ⚠️ forecasting horizon (in windows, not rows)
    hidden_dim        : 64
    epochs            : 50
    earlystop_patience: 10
    # dataset_list: ["nasa_moon", "china_weather", "szeged_weather", "india_ocean_waves", "longterm_weather", "panama", "wind_power", "turbine_power"]

  persistence:
    max_dim   : 2
    pixel_size: 0.2

  topo_model:
    topo_every  : 5
    hidden_dim  : 64
    epochs      : 20
    batch_size  : 32
    lr          : 0.001
    lambda_topo : 0.05
    N_runs      : 2 # num times the model is run to get the avg performance


  # default:
  #   {lambda_recon: 0.05, lambda_kl_euc: 0.05, lambda_pred: 200, window_size: 168, z_dim_total: 40,
