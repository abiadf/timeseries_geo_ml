# file for the params of DATASETS
general:
  train_epochs: 100

asm:
  num_window_splits: 10   # splits timesteps (rows) into this many windows
  num_rows_per_page: 500  # number of rows per page to use from dataset

  # train_epochs: 100
  batch_size        : 16
  latent_dim        : 32
  predictor_lr      : 0.006
  predictor_epochs  : 200
  predictor_dropout : 0.05
  predictor_hidden_sizes : [32, 48, 64] # latent to y output

