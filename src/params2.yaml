ecg:
  downsampling: (0.25, 0.05)

  timevae:
    epochs : 150 #timevae repo
    nn:
      predictor_lr      : 0.008
      predictor_epochs  : 150
      predictor_dropout : 0.05
      predictor_hidden_sizes : [16, 8] # latent to y output

  ts2vec:
    z_pooling_method   : "mean"
    ts2vec_hidden_dims : 32 # units in each layer (> than latent dim)
    ts2vec_latent_dims : 16 # latent dim
    ts2vec_depth       : 4 # num layers
    ts2vec_batch_size  : 32
    ts2vec_epochs      : 20

    predictor_lr       : 0.02
    predictor_epochs   : 300
    predictor_dropout  : 0.05
    predictor_hidden_sizes : [16, 48, 64]

  moment:
    classification:
      predictor_lr      : 0.009
      predictor_epochs  : 100
      predictor_dropout : 0.05
      predictor_hidden_sizes : [2048, 256, 128] # latent to y output


